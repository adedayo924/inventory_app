name: jims
description: "Jeilo Inventory Management System (JIMS) - Multi-platform retail POS & Inventory Suite"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.2
  sqflite_common: ^2.5.11
  sqflite_common_ffi: ^2.3.2
  sqflite_common_ffi_web: 1.1.3
  path_provider: ^2.1.2
  path: ^1.9.0
  intl: ^0.19.0
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0
  pdf: ^3.10.8
  printing: ^5.13.0
  file_picker: ^8.0.0
  csv: ^6.0.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  crypto: ^3.0.3
  web: ^1.1.1
  flutter_animate: ^4.5.0
  mobile_scanner: ^6.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  image: ^4.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
